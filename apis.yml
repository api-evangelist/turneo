name: Turneo
description: >-
  Turneo is an operating system for hotel experiences and services, backed by
  Bessemer Venture Partners. It digitizes the activities, spa & wellness, dining,
  rentals, transfers, and tickets a hotel offers, makes them bookable across
  guest touchpoints, and deploys AI agents to automate the operations behind
  them. Hotels and partners integrate through the Turneo v2 REST API
  (https://api.turneo.co, API-key authenticated) to search experiences, retrieve
  options and availability, and assemble and confirm booking orders, and through
  embeddable Turneo Elements widgets that add browse-and-book surfaces (with
  Apple Pay) directly to a partner website. It also plugs into existing tools
  such as Bokun, OPERA Cloud, apaleo, MEWS, and REGIONDO.
